<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7ecd8">
<title>26 November — Ocean Countdown</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#d9ccb4;color:#292825;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}body:after{content:'';position:fixed;inset:0;border:10px solid #d9ccb4;pointer-events:none;z-index:3}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}main{position:relative;height:100%;width:100%;padding:0 4vw}.content{position:absolute;left:0;right:0;top:14%;text-align:center}.eyebrow{margin:0 0 34px;font-size:clamp(10px,1vw,15px);font-weight:500;letter-spacing:.18em;text-transform:uppercase}.timer{display:flex;justify-content:center;gap:1.4vw;font-variant-numeric:tabular-nums}.unit{display:flex;flex-direction:column;align-items:center}.number{font-family:'Arial Black',Arial,Helvetica,sans-serif;font-size:clamp(60px,15.7vw,238px);font-weight:900;line-height:.94;letter-spacing:-.08em;padding-right:.08em}.label{font-size:10px;letter-spacing:.25em;text-transform:uppercase;margin-top:22px;font-weight:600}.separator{font-family:Georgia,serif;font-size:8vw;font-weight:700;line-height:1.3;margin:0 -.5vw}.complete{display:none;font-size:clamp(50px,10vw,150px);font-weight:900;letter-spacing:-.07em;margin:0}body.finished .timer{display:none}body.finished .complete{display:block}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:600px){body:after{border-width:6px}.content{top:20%}.eyebrow{font-size:9px;letter-spacing:.12em;margin-bottom:30px}.number{font-size:16vw}.label{font-size:7px;letter-spacing:.15em;margin-top:16px}.separator{font-size:8vw;line-height:1.5}.timer{gap:1vw}}@media(max-height:500px){.content{top:10%}.eyebrow{margin-bottom:16px}.number{font-size:min(14vw,25vh)}.label{margin-top:10px}}
</style>
</head>
<body>
<canvas id="ocean" aria-hidden="true"></canvas>
<main>

<section class="content" aria-label="Countdown to November 26, 2026 at 5 PM India Standard Time">
<h1 class="eyebrow">26 November 2026 &nbsp;·&nbsp; 5:00 PM IST</h1>
<div class="timer" role="timer" aria-live="off">
<div class="unit"><span class="number" id="days">00</span><span class="label">Days</span></div><span class="separator" aria-hidden="true">:</span>
<div class="unit"><span class="number" id="hours">00</span><span class="label">Hours</span></div><span class="separator" aria-hidden="true">:</span>
<div class="unit"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div><span class="separator" aria-hidden="true">:</span>
<div class="unit"><span class="number" id="seconds">00</span><span class="label">Seconds</span></div>
</div>
<p class="complete">The moment is here.</p>

<p class="sr-only" id="announcement" aria-live="polite"></p>
</section>

</main>
<script>
'use strict';
const TARGET=Date.parse('2026-11-26T17:00:00+05:30');
function remaining(now){const total=Math.max(0,Math.ceil((TARGET-now)/1000));return {total,days:Math.floor(total/86400),hours:Math.floor(total/3600)%24,minutes:Math.floor(total/60)%60,seconds:total%60};}
const canvas=document.getElementById('ocean'),ctx=canvas.getContext('2d');
const motion=matchMedia('(prefers-reduced-motion: reduce)');
let w=0,h=0,lastSecond=-1,ripples=[],finished=false;
function resize(){w=innerWidth;h=innerHeight;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',resize);resize();
function update(now){const value=remaining(now);for(const key of ['days','hours','minutes','seconds'])document.getElementById(key).textContent=String(value[key]).padStart(2,'0');if(value.total===0&&!finished){finished=true;document.body.classList.add('finished');document.getElementById('announcement').textContent='The moment is here. The countdown is complete.';}return value.total;}


function background(){const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#fcfbf8');g.addColorStop(.52,'#faf2e5');g.addColorStop(1,'#f6e5c5');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);}
function water(t){
 const y=h*.8;
 ctx.save();ctx.beginPath();ctx.moveTo(0,y);
 for(let x=0;x<=w+10;x+=10){const yy=y+Math.sin(x/w*9+t*.0006)*3+Math.sin(x/w*21-t*.0003)*1.5;ctx.lineTo(x,yy);}
 ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();
 const sea=ctx.createLinearGradient(0,y,0,h);sea.addColorStop(0,'#8bcbdb');sea.addColorStop(.12,'#b6dcd8');sea.addColorStop(.6,'#c5dfd6');sea.addColorStop(1,'#e4e6ce');ctx.fillStyle=sea;ctx.fill();ctx.clip();
 const glow=ctx.createRadialGradient(w*.5,y,3,w*.5,y,w*.52);glow.addColorStop(0,'#e7ffffa0');glow.addColorStop(.45,'#c8e8dd22');glow.addColorStop(1,'#86aca300');ctx.fillStyle=glow;ctx.fillRect(0,y-8,w,h);
 for(let i=0;i<34;i++){const yy=y+3+i*i*.22;ctx.beginPath();for(let x=0;x<w+12;x+=12){const v=yy+Math.sin(x/w*24+i*.7+t*.0004)*(1+i*.045);x===0?ctx.moveTo(x,v):ctx.lineTo(x,v);}ctx.strokeStyle=i%3===0?'rgba(255,255,244,.28)':'rgba(35,115,139,.08)';ctx.lineWidth=i%3===0?1.2:.7;ctx.stroke();}ctx.restore();
}
function drawRipple(x,y,age){const p=age/3000;if(p<0||p>1)return;const radius=14+p*Math.min(w*.62,650);for(let i=0;i<3;i++){const r=radius-i*9;if(r<=0)continue;ctx.beginPath();ctx.ellipse(x,y,r,r*.135,0,0,Math.PI*2);ctx.strokeStyle='rgba(27,105,136,'+((1-p)*(.32-i*.07))+')';ctx.lineWidth=2.4-i*.6;ctx.stroke();ctx.beginPath();ctx.ellipse(x,y-1.6,r,r*.135,0,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,245,'+((1-p)*.65)+')';ctx.lineWidth=1;ctx.stroke();}}
function drop(x,y,size,alpha){ctx.save();ctx.translate(x,y);ctx.scale(size,size);ctx.globalAlpha=alpha;ctx.beginPath();ctx.moveTo(0,-1.6);ctx.bezierCurveTo(-.18,-1.05,-.92,-.3,-.92,.25);ctx.bezierCurveTo(-.92,1.36,.92,1.36,.92,.25);ctx.bezierCurveTo(.92,-.3,.18,-1.05,0,-1.6);ctx.closePath();
 const blue=ctx.createRadialGradient(-.4,-.25,.03,.25,.35,1.4);blue.addColorStop(0,'#e4fcff');blue.addColorStop(.2,'#75d5ff');blue.addColorStop(.42,'#1599ed');blue.addColorStop(.7,'#0062b8');blue.addColorStop(1,'#002f64');ctx.fillStyle=blue;ctx.shadowColor='rgba(0,67,115,.2)';ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;ctx.clip();
 const rim=ctx.createLinearGradient(-1,0,1,0);rim.addColorStop(0,'#d5ffff99');rim.addColorStop(.2,'#ffffff00');rim.addColorStop(.75,'#ffffff00');rim.addColorStop(1,'#c5ffffaa');ctx.fillStyle=rim;ctx.fillRect(-1,-2,2,4);
 ctx.beginPath();ctx.ellipse(-.34,-.04,.15,.45,.4,0,Math.PI*2);ctx.fillStyle='#ffffffc9';ctx.fill();ctx.beginPath();ctx.ellipse(.26,.7,.35,.07,-.25,0,Math.PI*2);ctx.fillStyle='#70ddffb0';ctx.fill();ctx.restore();}
function frame(){const now=Date.now(),sec=Math.floor(now/1000),phase=now%1000,impact=720; if(sec!==lastSecond){lastSecond=sec;update(now);}background();water(motion.matches?0:now);
 const x=w*.5,surface=h*.8+4,size=Math.min(44,w*.085,h*.06);
 if(motion.matches){drop(x,surface-size*2.8,size,1);drawRipple(x,surface,1200);}else{
 if(!finished){const p=phase/impact;const cy=phase<impact?surface-size-h*.22*(1-p*p):surface-size+(phase-impact)/280*size*3.5;
 const shadow=ctx.createRadialGradient(x,surface,1,x,surface,size*2);shadow.addColorStop(0,'#246f8845');shadow.addColorStop(1,'#246f8800');ctx.save();ctx.translate(0,surface*.83);ctx.scale(1,.17);ctx.fillStyle=shadow;ctx.fillRect(x-size*2,surface-size*2,size*4,size*4);ctx.restore();
 ctx.save();ctx.beginPath();ctx.rect(0,0,w,surface);ctx.clip();drop(x,cy,size,1);ctx.restore();
 if(phase>=impact){const q=(phase-impact)/280;ctx.save();ctx.beginPath();ctx.rect(0,surface,w,h-surface);ctx.clip();drop(x,cy,size*(1-q*.2),(1-q)*.32);ctx.restore();
 ctx.beginPath();ctx.ellipse(x,surface,size*(.5+q),size*.13,0,0,Math.PI*2);ctx.strokeStyle='rgba(225,255,255,'+(1-q)+')';ctx.lineWidth=3;ctx.stroke();for(let i=0;i<6;i++){const a=Math.PI+i/5*Math.PI,dist=size*(.65+q*1.8);const sx=x+Math.cos(a)*dist,sy=surface+Math.sin(a)*size*1.1*Math.sin(q*Math.PI)+q*8;drop(sx,sy,size*.08*(1-q),1-q);}}
 }
 for(let i=0;i<4;i++){const age=phase-impact+i*1000;if(age>=0&&(!finished||now<TARGET+3000))drawRipple(x,surface,age);}}
 requestAnimationFrame(frame);}
update(Date.now());requestAnimationFrame(frame);
</script>
</body>
</html>
